<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>StockDSS — Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#030712;color:#c5d8f2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.wrap{text-align:center;max-width:380px;}
.icon{font-size:72px;margin-bottom:24px;filter:grayscale(0.3);}
h1{font-size:22px;font-weight:800;color:#fff;margin-bottom:10px;}
p{font-size:13px;color:#6b8bb5;line-height:1.7;margin-bottom:24px;}
.tip{background:#0c1627;border:1px solid #1c2e4a;border-radius:10px;padding:16px;font-size:11px;color:#6b8bb5;margin-bottom:24px;text-align:left;line-height:2;}
.tip b{color:#c5d8f2;}
.btn{display:inline-block;padding:12px 32px;border-radius:10px;background:linear-gradient(135deg,#00cc85,#009962);color:#001a0d;font-size:13px;font-weight:800;text-decoration:none;border:none;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">📡</div>
  <h1>Tidak Ada Koneksi</h1>
  <p>StockDSS memerlukan koneksi internet untuk mengambil data harga saham real-time dari Yahoo Finance.</p>
  <div class="tip">
    <b>Yang tersedia offline:</b><br>
    ✓ Hasil analisis terakhir (cache)<br>
    ✓ Watchlist data sebelumnya<br>
    ✗ Harga & data real-time<br>
    ✗ AI Summary (butuh API)
  </div>
  <button class="btn" onclick="location.reload()">🔄 Coba Lagi</button>
</div>
</body>
</html>
